// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // The AdbSocket plugin (app/src/main/java/tv/launcher/manager/) is Kotlin; Capacitor's
        // template is Java-only, so the Kotlin Android plugin is added here and applied in app/.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Kadb (com.flyfishxu:kadb — the Wireless-debugging PAIRING implementation, Apache-2.0)
        // pulls its SPAKE2 from JitPack (com.github.Flyfish233:spake2-java). Nothing else comes
        // from here.
        maven { url = 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
